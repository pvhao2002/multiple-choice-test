name: MCE Fetch Pillow Wheel

on:
  push:
    branches:
      - mce-fetch-pillow-20260730
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  fetch-wheel:
    runs-on: ubuntu-latest
    steps:
      - name: Download official Pillow CPython 3.14 Windows x64 wheel
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --output pillow-12.3.0-cp314-cp314-win_amd64.whl \
            https://files.pythonhosted.org/packages/f1/e0/492879f69d94f91f60fc8cd05ba03650e9520afebb2fb7aa12777d7c7f38/pillow-12.3.0-cp314-cp314-win_amd64.whl
          echo 'fdafc9cce40277e0f7a0feabce0ee50dd2fa1800f3b38015e51296b5e814048d  pillow-12.3.0-cp314-cp314-win_amd64.whl' | sha256sum --check
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: pillow-cp314-win-amd64
          path: pillow-12.3.0-cp314-cp314-win_amd64.whl
          if-no-files-found: error
          retention-days: 1
