name: Build MCE 24 Mock Test PDFs

on:
  push:
    branches:
      - mce-8-truong-24-de-thi-thu
    paths:
      - 'MCE_8_Truong_24_De_Thi_Thu_Master.json'
      - 'scripts/build_mce_pdfs.py'
      - '.github/workflows/build-mce-pdfs.yml'

permissions:
  contents: write

jobs:
  build-pdfs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: mce-8-truong-24-de-thi-thu
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF dependencies
        run: |
          python -m pip install --upgrade pip
          pip install reportlab pypdf
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils fonts-dejavu-core

      - name: Generate PDFs
        run: |
          python scripts/build_mce_pdfs.py

      - name: Validate PDFs
        run: |
          set -e
          for f in pdf_output/*.pdf; do
            echo "Checking $f"
            pdfinfo "$f" | grep -E 'Pages|Page size|File size'
            test "$(pdfinfo "$f" | awk '/Pages:/ {print $2}')" -gt 20
            pdftotext "$f" - | head -n 30
          done
          test "$(ls pdf_output/*.pdf | wc -l)" -eq 3

      - name: Commit PDFs back to branch
        run: |
          git config user.name "MCE PDF Builder"
          git config user.email "actions@users.noreply.github.com"
          git add pdf_output/*.pdf
          if git diff --cached --quiet; then
            echo "No PDF changes to commit"
          else
            git commit -m "Build reviewed PDF set for 24 MCE mock tests [skip ci]"
            git push origin HEAD:mce-8-truong-24-de-thi-thu
          fi

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: MCE_8_Truong_24_De_Thi_Thu_PDFs
          path: pdf_output/*.pdf
          if-no-files-found: error
